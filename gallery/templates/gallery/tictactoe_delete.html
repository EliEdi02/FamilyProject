{% extends 'gallery/base.html' %}

{% block title %}Spiel löschen - Tic-Tac-Toe{% endblock %}

{% block content %}
    <a class="back-link" href="{% url 'tic_tac_toe_detail' game.id %}">← Zurück zum Spiel</a>

    <section class="form-page-card danger-card">
        <div class="section-header">
            <div>
                <p class="section-kicker">Tic-Tac-Toe</p>
                <h1>Spiel löschen</h1>
            </div>
        </div>

        <p class="page-intro">
            Möchtest du dieses Spiel wirklich löschen?
            Diese Aktion kann nicht rückgängig gemacht werden.
        </p>

        <form method="post" class="modern-form">
            {% csrf_token %}
            <button type="submit" class="danger-button">Ja, Spiel löschen</button>
        </form>
    </section>
{% endblock %}
